<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมงูกินจุด - MiniGameHub</title>
    <link rel="stylesheet" href="snake.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="game-container">
        <header class="game-header">
            <a href="home.html" class="btn-back">⬅ กลับหน้าหลัก</a>
            <h1>🐍 เกมงูกินจุด</h1>
            <div class="score-board">คะแนน: <span id="score">0</span> | สูงสุด: <span id="highScore">0</span></div>
        </header>

        <div class="canvas-wrapper">
            <canvas id="snakeCanvas" width="400" height="400"></canvas>
            
            <!-- หน้าต่างแสดงตอนจบเกม -->
            <div id="gameMessage" class="game-message hidden">
                <h2 id="messageText">GAME OVER</h2>
                <p id="subMessageText" class="sub-message">กดปุ่ม R เพื่อเล่นใหม่</p>
                <button id="restartBtn" class="btn-primary">เล่นอีกครั้ง</button>
            </div>
        </div>
    </div>

    <script src="snake.js"></script>
</body>
</html>
