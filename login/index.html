<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเข้าสู่ระบบ / ลงทะเบียน</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-card">
    <h2 id="formTitle">เข้าสู่ระบบ</h2>
    
    <form id="authForm">
      <div class="input-group">
        <label for="username">ชื่อผู้ใช้ (ID)</label>
        <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" required>
      </div>

      <div class="input-group">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary">เข้าสู่ระบบ</button>
    </form>

    <div class="toggle-mode">
      <span id="toggleText">ยังไม่มีบัญชีใช่ไหม?</span>
      <a href="#" id="toggleBtn">สมัครสมาชิกใหม่</a>
    </div>

    <div id="statusMessage"></div>
  </div>

  <script src="login.js"></script>
</body>
</html>
